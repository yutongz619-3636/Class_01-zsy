{% extends "base.html" %}

{% block content %}
{% if name is defined and message is defined %}
    <h2 style="color:#667eea;">{{ name }} 的反馈：</h2>
    <div class="card">
        <p style="font-size:16px;line-height:1.8;">{{ message }}</p>
    </div>
{% else %}
    <div class="card">
        <h1 class="card-title">意见反馈</h1>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/feedback">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label class="form-label">姓名</label>
                <input class="form-input" type="text" name="name" placeholder="请输入姓名" required>
            </div>
            <div class="form-group">
                <label class="form-label">留言</label>
                <textarea class="form-input" name="message" rows="5" placeholder="请输入反馈内容" required style="resize:vertical;"></textarea>
            </div>
            <button class="btn btn-block" type="submit">提交反馈</button>
        </form>
    </div>
{% endif %}
{% endblock %}
